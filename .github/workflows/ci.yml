name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed git quickshell qt6-declarative qt6-svg qt6-imageformats nodejs npm jq shellcheck systemd sway python-gobject dbus matugen grim kitty wtype upower power-profiles-daemon
          # Arch's sway binary asks for cap_sys_nice, which the CI container
          # cannot grant. Headless pixman tests do not need that capability.
          setcap -r /usr/bin/sway
          # Quickshell's power services use the system bus even with a headless
          # compositor. Containers do not start these services automatically.
          mkdir -p /run/dbus
          dbus-uuidgen --ensure
          dbus-daemon --system --fork
      - uses: actions/checkout@v4
      - name: Run all checks
        run: |
          # Keep daemon parents in the same step as their consumers and check
          # bus ownership before spending several minutes on the QML suite.
          /usr/lib/upowerd > /tmp/upower.log 2>&1 &
          /usr/lib/power-profiles-daemon > /tmp/power-profiles.log 2>&1 &
          for service in org.freedesktop.UPower org.freedesktop.UPower.PowerProfiles; do
            ready=false
            for attempt in $(seq 1 50); do
              if busctl --system status "$service" >/dev/null 2>&1; then ready=true; break; fi
              sleep 0.1
            done
            if [ "$ready" != true ]; then
              cat /tmp/upower.log /tmp/power-profiles.log
              exit 1
            fi
          done
          useradd -m -s /bin/bash ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          runuser -u ci -- env CI=true GITHUB_WORKSPACE="$GITHUB_WORKSPACE" bash -c 'cd "$GITHUB_WORKSPACE" && tests/run-all.sh'
