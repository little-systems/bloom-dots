# Bloom's kitty settings. kitty.conf includes this first and Bloom's colours
# (bloom-theme.conf) next, so anything you set there wins. Updated by bloom update.

font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 8
cursor_shape     beam
cursor_trail     1
confirm_os_window_close 0
enable_audio_bell no
background_opacity 0.92
dynamic_background_opacity yes

# Ctrl+C copies a selection and interrupts otherwise; Ctrl+F opens the
# scrollback in a pager (search with /).
map ctrl+c        copy_or_interrupt
map ctrl+f        show_scrollback
map ctrl+plus     change_font_size all +1
map ctrl+equal    change_font_size all +1
map ctrl+kp_add   change_font_size all +1
map ctrl+minus    change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0        change_font_size all 0
