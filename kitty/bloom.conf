# Bloom's kitty settings. kitty.conf includes this first and Bloom's accent
# (bloom-theme.conf) next, so anything you set there wins. Updated by bloom update.

font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 8
cursor_shape     beam
cursor_trail     1
confirm_os_window_close 0
enable_audio_bell no
# Translucent so Hyprland's blur shows through; the same palette in every
# Bloom theme mode. Bloom's theme sets only the cursor and selection (its accent).
background_opacity 0.65
dynamic_background_opacity yes
foreground #e6e7eb
background #111216
color0  #1c1d22
color8  #5c5f6a
color1  #ff6b6b
color9  #ff8787
color2  #5fd38d
color10 #7ee2a8
color3  #f7c35f
color11 #ffd682
color4  #5aa9ff
color12 #80bdff
color5  #c792ea
color13 #d7a8f5
color6  #4fd1c5
color14 #7fe3d9
color7  #c9cbd3
color15 #ffffff

# Ctrl+C copies a selection and interrupts otherwise; Ctrl+F opens the
# scrollback in a pager (search with /).
map ctrl+c        copy_or_interrupt
map ctrl+f        show_scrollback
map ctrl+plus     change_font_size all +1
map ctrl+equal    change_font_size all +1
map ctrl+kp_add   change_font_size all +1
map ctrl+minus    change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0        change_font_size all 0
