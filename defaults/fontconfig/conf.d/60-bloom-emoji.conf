<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Bloom's emoji: Twemoji (vector colour, crisp at every size) first, Noto
     Color Emoji for anything Twemoji lacks. Installed by Bloom where you had
     no file of this name; yours from then on. -->
<fontconfig>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Twemoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
